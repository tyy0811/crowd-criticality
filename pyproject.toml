[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "critaudit"
version = "0.0.1"
description = "Branching-ratio / criticality audit toolkit"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
dependencies = ["numpy>=1.24", "scipy>=1.10", "powerlaw>=1.5"]

[project.optional-dependencies]
dev = ["pytest>=7"]
# Embedding realization for the matched parrot null (sub-inc 2, design 2026-07-17 §4).
# OPTIONAL so the core install and the CI fast path never import torch; the pinned model
# revision lives in critaudit.sim.controls.llm_parrot_spec.
embed = ["sentence-transformers>=3.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = ["slow: realistic-sample tests; excluded from CI fast path"]
testpaths = ["tests"]
